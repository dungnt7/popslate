<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Popslate</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfbfb; --fg: #1b1b1b; --muted: #707070; --hover: #0000000f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #2b2b2b; --fg: #f2f2f2; --muted: #a8a8a8; --hover: #ffffff14; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  /* Sized by its content, not by the window: the window is then fitted to it. */
  #box { position: absolute; top: 0; left: 0; display: flex; flex-direction: column;
    width: max-content; min-width: 200px; max-width: 440px; max-height: 100vh; }
  header { display: flex; align-items: center; gap: 2px; padding: 4px 4px 0 14px; user-select: none; }
  #lang { flex: 1; color: var(--muted); font-size: 11px; letter-spacing: .06em; }
  button { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 5px;
    background: none; color: var(--muted); cursor: pointer; }
  button:hover, button:focus-visible { background: var(--hover); color: var(--fg); outline: none; }
  button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; }
  main { min-height: 0; overflow: auto; padding: 0 14px 12px; scrollbar-width: thin; }
  #text { white-space: pre-wrap; overflow-wrap: anywhere; }
  #text.muted { color: var(--muted); }
  /* Just a reminder of what was selected: line breaks collapsed, 2 lines max. */
  #source { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.4;
    overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #source:empty { display: none; }
</style>
</head>
<body>
<div id="box">
  <header data-tauri-drag-region>
    <span id="lang" data-tauri-drag-region></span>
    <button id="copy" aria-label="Copy translation" title="Copy" hidden>
      <svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>
    </button>
    <button id="close" aria-label="Close" title="Close (Esc)">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>
  <main><div id="text" aria-live="polite"></div><div id="source"></div></main>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = (id) => document.getElementById(id);
  const COPY_ICON = $('copy').innerHTML;
  const CHECK_ICON = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  let loadingTimer;

  // Natural content size; Rust caps the height and the rest scrolls.
  const fit = (id) => invoke('popup_fit', {
    id,
    width: $('box').offsetWidth,
    height: document.querySelector('header').offsetHeight + document.querySelector('main').scrollHeight,
  });

  listen('popup', ({ payload: p }) => {
    clearTimeout(loadingTimer);
    const done = p.state === 'done';
    $('text').textContent = { loading: 'Translating…', error: p.message, done: p.text }[p.state];
    $('text').className = done ? '' : 'muted';
    $('source').textContent = p.source ?? '';
    $('lang').textContent = done ? `${p.src} → ${p.tl}`.toUpperCase() : '';
    $('copy').hidden = !done;
    $('copy').innerHTML = COPY_ICON;
    document.querySelector('main').scrollTop = 0;
    // A fast result skips the loading frame: no flash, no extra resize.
    if (p.state === 'loading') loadingTimer = setTimeout(() => fit(p.id), 150);
    else fit(p.id);
  });

  $('copy').onclick = async () => {
    await navigator.clipboard.writeText($('text').textContent);
    $('copy').innerHTML = CHECK_ICON;
  };
  $('close').onclick = () => invoke('popup_hide');
  addEventListener('keydown', (e) => { if (e.key === 'Escape') invoke('popup_hide'); });
</script>
</body>
</html>
