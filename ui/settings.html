<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Popslate Settings</title>
<style>
  :root { color-scheme: light dark; --bg: #f9f9f9; --fg: #1b1b1b; --muted: #6b6b6b; --field: #fff; --line: #e0e0e0;
    --accent: #e8431f; --error: #c42b1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #202020; --fg: #f2f2f2; --muted: #a8a8a8; --field: #2d2d2d;
    --line: #3a3a3a; --accent: #ff7a5c; --error: #ff99a4; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  form { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; padding: 20px 24px 8px; }
  label { color: var(--muted); }
  select, #hotkey { font: inherit; color: inherit; background: var(--field); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 8px; min-width: 0; }
  select:focus-visible, #hotkey:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #hotkey { text-align: left; cursor: pointer; }
  #hotkey.recording { border-color: var(--accent); color: var(--accent); }
  /* Native checkbox drawn as a switch: keeps keyboard and screen reader support. */
  .switch { appearance: none; justify-self: start; position: relative; width: 40px; height: 20px; margin: 0;
    border: 1px solid var(--muted); border-radius: 10px; background: var(--field); cursor: pointer;
    transition: background .15s, border-color .15s; }
  .switch::before { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--muted); transition: transform .15s; }
  .switch:checked { background: var(--accent); border-color: var(--accent); }
  .switch:checked::before { background: #fff; transform: translateX(20px); }
  #status { min-height: 1.5em; padding: 0 24px 8px; font-size: 13px; color: var(--muted); }
  #status.error { color: var(--error); }
  footer { margin-top: auto; padding: 8px 24px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover, footer a:focus-visible { text-decoration: underline; outline: none; }
</style>
</head>
<body>
<form onsubmit="return false">
  <label for="target">Translate to</label>
  <select id="target"></select>

  <label for="fallback" title="Used when the selected text is already in the target language">If already in it</label>
  <select id="fallback"></select>

  <label for="hotkey">Hotkey</label>
  <button id="hotkey" type="button" title="Click, then press the new key combination (Esc cancels)"></button>

  <label for="autostart">Start with Windows</label>
  <input id="autostart" class="switch" type="checkbox" role="switch">
</form>
<div id="status" role="status"></div>
<footer><span id="about"></span> · <a id="homepage" href="#"></a></footer>
<script>
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);

  // Google Translate language codes. Names come from the browser, so no list to maintain.
  const CODES = ['af','sq','am','ar','hy','as','ay','az','bm','eu','be','bn','bho','bs','bg','ca','ceb','ny',
    'zh-CN','zh-TW','co','hr','cs','da','dv','doi','nl','en','eo','et','ee','tl','fi','fr','fy','gl','ka','de',
    'el','gn','gu','ht','ha','haw','iw','hi','hmn','hu','is','ig','ilo','id','ga','it','ja','jw','kn','kk','km',
    'rw','gom','ko','kri','ku','ckb','ky','lo','la','lv','ln','lt','lg','lb','mk','mai','mg','ms','ml','mt','mi',
    'mr','mni-Mtei','lus','mn','my','ne','no','or','om','ps','fa','pl','pt','pa','qu','ro','ru','sm','sa','gd',
    'nso','sr','st','sn','sd','si','sk','sl','so','es','su','sw','sv','tg','ta','tt','te','th','ti','ts','tr',
    'tk','ak','uk','ur','ug','uz','vi','cy','xh','yi','yo','zu'];
  // Google uses a few old or non-standard codes; name them by their standard code.
  const NAME_AS = { 'zh-CN': 'zh-Hans', 'zh-TW': 'zh-Hant', iw: 'he', jw: 'jv', 'mni-Mtei': 'mni' };
  const names = new Intl.DisplayNames(['en'], { type: 'language' });
  const langs = CODES.map((c) => [c, names.of(NAME_AS[c] ?? c)]).sort((a, b) => a[1].localeCompare(b[1]));
  for (const sel of [$('target'), $('fallback')]) {
    for (const [code, name] of langs) sel.add(new Option(name, code));
  }

  let cfg, recording = false, statusTimer;

  function status(text, error = false) {
    clearTimeout(statusTimer);
    $('status').textContent = text;
    $('status').className = error ? 'error' : '';
    if (!error) statusTimer = setTimeout(() => ($('status').textContent = ''), 2000);
  }

  const showHotkey = () => { $('hotkey').textContent = cfg.hotkey.split('+').join(' + '); };

  // Re-read on every focus: shows what is really active (e.g. a hotkey taken by another app).
  async function load() {
    cfg = await invoke('get_settings');
    $('target').value = cfg.target_lang;
    $('fallback').value = cfg.fallback_lang;
    $('autostart').checked = cfg.autostart;
    showHotkey();
    if (!cfg.hotkey_ok) status(`${cfg.hotkey} is used by another app. Click Hotkey to pick another.`, true);
  }

  async function save(change) {
    const { hotkey_ok, ...current } = cfg;
    try {
      await invoke('set_settings', { new: { ...current, ...change } });
      status('Saved.');
    } catch (e) {
      status(String(e), true);
    }
    await load();
  }

  $('target').onchange = (e) => save({ target_lang: e.target.value });
  $('fallback').onchange = (e) => save({ fallback_lang: e.target.value });
  $('autostart').onchange = (e) => save({ autostart: e.target.checked });

  function record(on) {
    recording = on;
    $('hotkey').classList.toggle('recording', on);
    if (on) $('hotkey').textContent = 'Press keys…'; else showHotkey();
  }
  $('hotkey').onclick = () => record(true);
  $('hotkey').onblur = () => record(false);
  $('hotkey').onkeydown = (e) => {
    if (!recording) return;
    e.preventDefault();
    if (e.key === 'Escape') return record(false);
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return; // wait for the main key
    const mods = [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Super'].filter(Boolean);
    if (!mods.length) return status('Use at least one of Ctrl, Alt, Shift or Win.', true);
    // code names the physical key; it is empty for input without scan codes (remote
    // desktop, on-screen keyboards), so fall back to the character.
    const key = e.code ? e.code.replace(/^(Key|Digit)/, '') : e.key.length === 1 ? e.key.toUpperCase() : '';
    if (!key) return status('That key can\'t be used. Try another one.', true);
    record(false);
    save({ hotkey: [...mods, key].join('+') });
  };

  invoke('about').then(({ version, homepage }) => {
    $('about').textContent = `Popslate ${version}`;
    $('homepage').textContent = homepage.replace(/^https:\/\//, '');
  });
  // Rust opens the fixed homepage in the browser; navigating the webview would replace this page.
  $('homepage').onclick = (e) => { e.preventDefault(); invoke('open_homepage'); };

  addEventListener('focus', load);
  load();
</script>
</body>
</html>
